name: Algorithm Interview 100 · code and content oracle

on:
  pull_request:
    paths:
      - 'algorithm-interview-100/**'
      - '.github/workflows/algorithm-interview.yml'
  push:
    paths:
      - 'algorithm-interview-100/**'
      - '.github/workflows/algorithm-interview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness-and-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: algorithm-interview-100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository structure, links and code syntax
        run: python scripts/check_repo.py
      - name: Expanded content integrity
        run: python scripts/check_content_depth.py
      - name: Metadata and inline-source parity
        run: python scripts/check_contracts.py
      - name: Compile Python source and checks
        run: python -m compileall -q solutions/python scripts tests
      - name: Run independent seeded oracle and stateful regression tests
        run: python -m unittest discover -s tests -v
