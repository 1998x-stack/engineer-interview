name: CV handbook validation

on:
  pull_request:
    paths:
      - 'cv-algorithm-interview-handbook-v2/**'
      - '.github/workflows/cv-handbook.yml'
  push:
    paths:
      - 'cv-algorithm-interview-handbook-v2/**'
      - '.github/workflows/cv-handbook.yml'
  workflow_dispatch:

jobs:
  cv-handbook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-algorithm-interview-handbook-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install documentation and test dependencies
        run: |
          python -m pip install -r requirements-docs.txt pytest
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate question metadata and links
        run: python scripts/validate_repo.py
      - name: Test numerical references
        run: python -m pytest -q tests
      - name: Strict MkDocs build
        run: mkdocs build --strict
