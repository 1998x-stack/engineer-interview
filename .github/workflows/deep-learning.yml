name: Deep learning handbook numerical quality

on:
  pull_request:
    paths:
      - 'deep-learning-interview-100/**'
      - '.github/workflows/deep-learning.yml'
  push:
    paths:
      - 'deep-learning-interview-100/**'
      - '.github/workflows/deep-learning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deep-learning-interview-100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install pytest numpy
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-docs.txt
      - name: Validate 100-topic structure
        run: python scripts/check_repo.py
      - name: Check JSON/JSONL/frontmatter contract
        run: python scripts/check_contracts.py
      - name: Check generated question index
        run: python scripts/build_index.py --check
      - name: Verify numerical oracle parity and failure behavior
        run: python -m pytest -q tests
      - name: Compile Python reference modules
        run: python -m compileall -q examples scripts tests
      - name: Stage documentation sources
        run: python scripts/stage_docs.py
      - name: Build documentation strictly
        run: mkdocs build --strict
