name: NLP LLM handbook validation

on:
  pull_request:
    paths:
      - 'nlp-llm-interview-100/**'
      - '.github/workflows/nlp-llm.yml'
  push:
    paths:
      - 'nlp-llm-interview-100/**'
      - '.github/workflows/nlp-llm.yml'
  workflow_dispatch:

jobs:
  nlp-handbook:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nlp-llm-interview-100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation and numerical test requirements
        run: |
          python -m pip install -r requirements-docs.txt pytest numpy
          python -m pip install 'torch==2.5.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Check question and provenance integrity
        run: python scripts/check_repo.py
      - name: Run independent reference tests
        run: python -m pytest -q tests
      - name: Build standalone docs strictly
        run: mkdocs build --strict
