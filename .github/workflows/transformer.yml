name: Transformer module validation

on:
  push:
    paths:
      - 'transformer-interview-100/**'
      - '.github/workflows/transformer.yml'
  pull_request:
    paths:
      - 'transformer-interview-100/**'
      - '.github/workflows/transformer.yml'
  workflow_dispatch:

jobs:
  transformer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transformer-interview-100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-docs.txt
          python -m pip install 'torch>=2.2,<3'
      - name: Validate question structure
        run: python scripts/check_docs.py
      - name: Validate local links
        run: python scripts/check_links.py
      - name: Run attention regression tests
        run: python -m pytest -q tests
      - name: Build documentation strictly
        run: mkdocs build --strict
