name: 新题建议 / New question
description: 建议新增 Production Agent 面试题或追问
title: "[Question] "
labels: [enhancement]
body:
  - type: dropdown
    id: axis
    attributes:
      label: 能力轴
      options:
        - Agent Loop / 架构
        - Planning / 控制
        - Tool / MCP
        - Multi-Agent
        - Context / Memory
        - Agentic RAG
        - Runtime / Fault Tolerance
        - Eval / Observability
        - Security / HITL
        - Performance / Cost
  - type: textarea
    id: question
    attributes:
      label: 建议题目
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Know-Why / 面试价值
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: Know-How / 期望覆盖机制
