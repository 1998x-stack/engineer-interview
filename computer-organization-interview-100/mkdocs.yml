site_name: 计算机组成原理面试 100 题
site_description: 100 道计算机组成原理与体系结构面试题，一题一个 Markdown
theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - content.code.annotate
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
