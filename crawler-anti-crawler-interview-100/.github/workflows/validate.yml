name: validate-docs
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - run: python scripts/validate_questions.py
      - run: python scripts/validate_source_coverage.py
      - run: python scripts/validate_links.py
