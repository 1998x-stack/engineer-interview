site_name: Deep Learning Interview 100 · 2026
site_description: 深度学习 / 大模型算法岗 100 题系统面试手册
repo_name: deep-learning-interview-100
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
docs_dir: .
site_dir: site
