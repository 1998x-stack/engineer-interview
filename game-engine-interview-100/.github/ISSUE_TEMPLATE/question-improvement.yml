name: Question improvement
description: Improve or correct one interview question
title: "[Qxxx] "
body:
  - type: input
    id: qid
    attributes:
      label: Question ID
      placeholder: Q078
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / improvement
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / references
      description: Prefer official docs, specs, papers, reproducible benchmarks.
