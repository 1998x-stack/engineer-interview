site_name: Game Engine Interview 100
site_description: 100 game-engine interview questions with source-separated deep engineering expansions
repo_name: game-engine-interview-100
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
nav:
  - 首页: index.md
  - 100 道题: questions/README.md
  - 学习路线: STUDY_GUIDE.md
  - 面试评分: INTERVIEW_RUBRIC.md
  - PDF Source Map: PDF_SOURCE_MAP.md
  - Sources: SOURCES.md
