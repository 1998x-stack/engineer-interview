docs_dir: .
site_dir: site
exclude_docs: |
  source/
  assets/pdf/
  .github/
  scripts/
site_name: 高中数学竞赛教练面试100题
site_description: 高中数学竞赛教练岗位的100题专业面试知识库
repo_name: high-school-math-olympiad-coach-interview
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - tables
  - attr_list
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
