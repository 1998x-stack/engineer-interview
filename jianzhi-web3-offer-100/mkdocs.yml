site_name: 剑指 Web3 Offer - 100 Interview Questions
site_description: Web3 / Solidity / DeFi / L2 / Account Abstraction professional interview handbook
repo_name: jianzhi-web3-offer-100

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite

