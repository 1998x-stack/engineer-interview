site_name: 剑指 LLM 后训练 Offer
site_description: 100 道 LLM Post-Training 面试题精讲
repo_name: llm-post-training-offer

theme:
  name: material
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 使用指南:
      - 四遍法: 00-guide/README.md
      - 知识地图: 00-guide/knowledge-map.md
      - 核心公式: 00-guide/core-formulas.md
      - 算法演化: 00-guide/algorithm-evolution.md
      - 评分 Rubric: 00-guide/scoring-rubric.md
      - 研究方法论: 00-guide/research-methodology.md
      - 工程实现检查表: 00-guide/implementation-checklist.md
  - 100 题总索引: question-index.md
