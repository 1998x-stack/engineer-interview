site_name: 宏观经济学面试 100 题
site_description: Professional macroeconomics interview question bank
repo_name: macroeconomics-interview-100
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - attr_list
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
  - Home: index.md
  - 使用指南:
      - Overview: 00-guide/README.md
      - 6 层回答法: 00-guide/answer-framework.md
      - Question Schema: 00-guide/question-schema.md
