name: validate

on:
  push:
  pull_request:

jobs:
  repo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate question structure and links
        run: python scripts/validate_repo.py
      - name: Validate V2 expert depth
        run: python scripts/validate_content_v2.py
      - name: Smoke-test Python labs
        run: |
          python -m py_compile labs/02-hashing/consistent_hash.py labs/03-mini-memcached/mini_memcached.py
          python labs/02-hashing/consistent_hash.py
          python labs/03-mini-memcached/mini_memcached.py
      - name: Build MkDocs site
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
