name: Question improvement
description: Improve an existing interview question
title: "[Qxxx] "
labels: ["question-improvement"]
body:
  - type: input
    id: qid
    attributes:
      label: Question ID
      placeholder: Q043
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be improved?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / reference
      description: Prefer papers, official docs, or reproducible experiments.
