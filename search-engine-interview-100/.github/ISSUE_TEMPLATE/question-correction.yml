name: 题目修正
description: 修正某一道题的定义、公式、工程实践或引用
title: "[Qxxx] "
labels: [content]
body:
  - type: input
    id: qid
    attributes:
      label: Question ID
      placeholder: Q024
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 问题
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据 / 参考资料
