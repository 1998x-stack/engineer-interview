site_name: 搜索引擎算法岗面试宝典
site_description: 100 道 Search Relevance / Retrieval / LTR / ANN / RAG 面试题
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.arithmatex:
      generic: true
nav:
  - 首页: index.md
  - 使用说明: 00-preface.md
  - 100题索引: INDEX.md
  - 学习路径: STUDY_PATHS.md
  - 标签索引: TAGS.md
  - 术语表: GLOSSARY.md
  - 模拟面试 Rubric: INTERVIEW_RUBRIC.md
  - 公式速查: appendices/A-formulas.md
  - 系统设计模板: appendices/B-system-design-template.md
  - 14天计划: appendices/C-14-day-plan.md
  - 10个核心问题: appendices/D-10-questions.md
  - 参考资料: references/README.md
