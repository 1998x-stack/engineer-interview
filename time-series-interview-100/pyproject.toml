[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-interview"
version = "0.1.0"
description = "Leakage-safe utilities accompanying the time-series interview repository"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]
